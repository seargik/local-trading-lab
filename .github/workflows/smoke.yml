name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall app.py backtest_app.py backtest_worker.py app_src pages
      - name: Run repo smoke tests
        run: |
          python smoke_test_v28_4_repo_ready.py
          python smoke_test_v28_5_demo_lifecycle_fit.py
          python smoke_test_v28_6_historical_backfill.py
          python smoke_test_v28_7_history_manager.py
          python smoke_test_v28_8_lifecycle_gate.py
          python smoke_test_v28_9_research_command_center.py
          python smoke_test_v28_10_runtime_cycle.py
          python smoke_test_v28_11_strategy_family_registry.py
          python smoke_test_v28_12_ohlcv_compression_benchmark.py
          python smoke_test_v28_13_evidence_review.py
          python smoke_test_v28_14_walk_forward.py
          python smoke_test_v28_15_fresh_holdout.py
          python smoke_test_v28_16_market_state_router.py
          python smoke_test_v28_17_market_state_replay.py
          python smoke_test_v28_18_timing_integrity.py
          python smoke_test_v28_19_history_integrity.py
          python smoke_test_v28_20_adaptive_evidence.py
          python smoke_test_v28_21_shared_account.py
          python smoke_test_v28_22_adaptive_portfolio_walk_forward.py
          python smoke_test_v28_23_future_adaptive_portfolio_holdout.py
