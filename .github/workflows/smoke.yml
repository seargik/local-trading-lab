name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall app.py backtest_app.py backtest_worker.py app_src
      - name: Run repo smoke test
        run: python smoke_test_v28_4_repo_ready.py
